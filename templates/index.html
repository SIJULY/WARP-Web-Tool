<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO-Sijuly Web Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .tab-btn {
            border-bottom-width: 4px;
            border-color: #111827;
            transition: all 0.1s ease-in-out;
        }

        .tab-btn:hover {
            background-color: #374151;
        }

        .tab-btn.active {
            border-bottom-width: 0px;
            border-top-width: 4px;
            border-top-color: #3b82f6;
            background-color: #1f2937;
            color: #60a5fa;
            transform: translateY(4px);
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 真实光标闪烁动画 */
        @keyframes cursor-blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .animate-cursor {
            animation: cursor-blink 1s step-end infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4 sm:p-8">
<div class="w-full max-w-6xl bg-gray-800 rounded-xl shadow-2xl p-6 md:p-8 border border-gray-700">
    <h1 class="text-3xl md:text-4xl font-bold text-center text-blue-400 mb-10">🚀 ZERO-Sijuly 工具箱</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Organization (Team Name)</label>
                <input type="text" id="org" placeholder="如: sijuly"
                       class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Email (授权邮箱)</label>
                <input type="email" id="email" placeholder="example@icloud.com"
                       class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">节点名称</label>
                <input type="text" id="proxy_name" value="WARP-ZERO"
                       class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div class="flex flex-col xl:flex-row space-y-3 xl:space-y-0 xl:space-x-3 pt-4">
                <button onclick="startExtract()"
                        class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-all active:scale-95">
                    提取节点信息
                </button>
                <button onclick="startScan()"
                        class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-all active:scale-95">
                    仅优选 IP
                </button>
            </div>
        </div>

        <div class="lg:col-span-2 bg-black rounded-xl p-5 border border-gray-700 shadow-inner flex flex-col h-[320px]">
            <div class="flex items-center space-x-2 mb-3 border-b border-gray-800 pb-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span class="text-xs text-gray-500 ml-2 font-mono">Terminal - Log Output</span>
            </div>
            <div id="logArea"
                 class="terminal text-[15px] leading-relaxed text-green-400 overflow-y-auto flex-1 space-y-1 pr-2">
                <div>> 系统准备就绪，等待指令...</div>
            </div>
        </div>
    </div>

    <div id="otpSection" class="mt-8 p-6 border-2 border-gray-700 rounded-xl bg-gray-800 shadow-lg transition-all">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex-1">
                <h3 class="text-xl font-bold text-gray-300 mb-1" id="otpTitle">🔑 安全验证 (等待触发)</h3>
                <p class="text-sm text-gray-500" id="otpDesc">提取任务进行中时，如果需要验证，请在此输入邮箱收到的 6
                    位验证码。</p>
            </div>
            <div class="flex w-full md:w-auto justify-center">

                <div class="relative w-full max-w-sm md:w-80 h-16 cursor-text"
                     onclick="document.getElementById('otpInput').focus()">

                    <!-- 真实的透明输入框，接收真实输入 -->
                    <input type="tel" id="otpInput" maxlength="6" disabled autocomplete="off"
                           oninput="handleOTPInput(this.value)"
                           onfocus="renderOTP(this.value, true)"
                           onblur="renderOTP(this.value, false)"
                           class="absolute inset-0 w-full h-full z-10 opacity-0 text-transparent caret-transparent cursor-text disabled:cursor-not-allowed">

                    <!-- 虚拟显示层 -->
                    <div id="otpDisplay"
                         class="absolute inset-0 flex items-center justify-center gap-2 md:gap-4 bg-gray-900 border border-gray-700 rounded-lg pointer-events-none transition-colors">
                        <!-- 初始化状态由 JS renderOTP 渲染 -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="resultSection" class="mt-8 rounded-xl shadow-2xl overflow-hidden">
        <div class="flex w-full space-x-2 bg-gray-900 p-2 rounded-t-xl border-b border-gray-700">
            <button onclick="switchTab('Surge')" id="btn-Surge"
                    class="tab-btn active flex-1 flex items-center justify-center py-3 px-2 rounded-lg bg-gray-800 text-gray-400 font-bold shadow-md">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <span class="truncate">Surge</span>
            </button>
            <button onclick="switchTab('Stash')" id="btn-Stash"
                    class="tab-btn flex-1 flex items-center justify-center py-3 px-2 rounded-lg bg-gray-800 text-gray-400 font-bold shadow-md">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                <span class="truncate">Stash/Meta</span>
            </button>
            <button onclick="switchTab('Loon')" id="btn-Loon"
                    class="tab-btn flex-1 flex items-center justify-center py-3 px-2 rounded-lg bg-gray-800 text-gray-400 font-bold shadow-md">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
                </svg>
                <span class="truncate">Loon</span>
            </button>
            <button onclick="switchTab('Shadowrocket')" id="btn-Shadowrocket"
                    class="tab-btn flex-1 flex items-center justify-center py-3 px-2 rounded-lg bg-gray-800 text-gray-400 font-bold shadow-md">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
                <span class="truncate">Shadowrocket</span>
            </button>
        </div>

        <div class="bg-gray-800 border border-gray-700 border-t-0 rounded-b-xl relative p-4">
            <div id="content-Surge" class="tab-content active relative">
                <textarea id="text-Surge" readonly placeholder="暂无配置，请先提取节点..."
                          class="w-full h-72 bg-gray-900 border border-gray-700 text-gray-300 font-mono text-[13px] p-4 rounded-lg focus:outline-none resize-none"></textarea>
                <button onclick="copyText('text-Surge', this)"
                        class="absolute top-4 right-4 bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 px-4 rounded shadow flex items-center transition-all opacity-80 hover:opacity-100">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    一键复制
                </button>
            </div>
            <div id="content-Stash" class="tab-content relative">
                <textarea id="text-Stash" readonly placeholder="暂无配置，请先提取节点..."
                          class="w-full h-72 bg-gray-900 border border-gray-700 text-gray-300 font-mono text-[13px] p-4 rounded-lg focus:outline-none resize-none"></textarea>
                <button onclick="copyText('text-Stash', this)"
                        class="absolute top-4 right-4 bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 px-4 rounded shadow flex items-center transition-all opacity-80 hover:opacity-100">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    一键复制
                </button>
            </div>
            <div id="content-Loon" class="tab-content relative">
                <textarea id="text-Loon" readonly placeholder="暂无配置，请先提取节点..."
                          class="w-full h-72 bg-gray-900 border border-gray-700 text-gray-300 font-mono text-[13px] p-4 rounded-lg focus:outline-none resize-none"></textarea>
                <button onclick="copyText('text-Loon', this)"
                        class="absolute top-4 right-4 bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 px-4 rounded shadow flex items-center transition-all opacity-80 hover:opacity-100">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    一键复制
                </button>
            </div>
            <div id="content-Shadowrocket" class="tab-content relative">
                <textarea id="text-Shadowrocket" readonly placeholder="暂无配置，请先提取节点..."
                          class="w-full h-72 bg-gray-900 border border-gray-700 text-gray-300 font-mono text-[13px] p-4 rounded-lg focus:outline-none resize-none"></textarea>
                <button onclick="copyText('text-Shadowrocket', this)"
                        class="absolute top-4 right-4 bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 px-4 rounded shadow flex items-center transition-all opacity-80 hover:opacity-100">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    一键复制
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let ws;
    const logArea = document.getElementById('logArea');

    // 初始化渲染空的横线（灰色状态）
    window.addEventListener('DOMContentLoaded', () => {
        renderOTP('', false);
    });

    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = function () {
            const div = document.createElement('div');
            div.innerHTML = `<span class="text-gray-500">[${new Date().toLocaleTimeString()}]</span> > ✅ WebSocket 已连接，可以开始操作。`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        };

        ws.onmessage = function (event) {
            const data = JSON.parse(event.data);

            if (data.type === 'log') {
                const div = document.createElement('div');
                div.innerHTML = `<span class="text-gray-500">[${new Date().toLocaleTimeString()}]</span> > ${data.msg}`;
                logArea.appendChild(div);
                logArea.scrollTop = logArea.scrollHeight;
            } else if (data.type === 'prompt_otp') {
                document.getElementById('otpSection').classList.replace('border-gray-700', 'border-blue-500');
                document.getElementById('otpTitle').textContent = "🔑 请查收并输入验证码";
                document.getElementById('otpTitle').classList.replace('text-gray-300', 'text-blue-400');
                document.getElementById('otpDesc').textContent = "6 位数验证码已发送至您的邮箱，请输入下方验证码。";
                document.getElementById('otpDesc').classList.replace('text-gray-500', 'text-gray-300');

                const otpInput = document.getElementById('otpInput');
                const otpDisplay = document.getElementById('otpDisplay');

                otpInput.disabled = false;
                otpInput.value = '';
                otpDisplay.classList.replace('border-gray-700', 'border-blue-500');

                // 渲染激活态的输入框，并触发焦点唤起光标
                renderOTP('', true);
                otpInput.focus();
            } else if (data.type === 'result') {
                document.getElementById('text-Surge').value = data.configs['Surge'] || '';
                document.getElementById('text-Stash').value = data.configs['Stash / Meta'] || '';
                document.getElementById('text-Loon').value = data.configs['Loon'] || '';
                document.getElementById('text-Shadowrocket').value = data.configs['Shadowrocket'] || '';

                switchTab('Surge');
                document.getElementById('resultSection').scrollIntoView({behavior: 'smooth', block: 'start'});
            }
        };

        ws.onclose = function () {
            setTimeout(connectWebSocket, 1000);
        };
    }

    function sendWS(payload) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            const msg = "WebSocket 尚未连接，请等待 1 秒后重试，或刷新页面。";
            const div = document.createElement('div');
            div.innerHTML = `<span class="text-gray-500">[${new Date().toLocaleTimeString()}]</span> > ❌ ${msg}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
            alert(msg);
            return false;
        }
        ws.send(JSON.stringify(payload));
        return true;
    }

    // 核心渲染逻辑：逐字插入，光标替代横线
    function renderOTP(val, isFocused) {
        const cleanVal = (val || '').replace(/\D/g, '').substring(0, 6);
        const displayDiv = document.getElementById('otpDisplay');
        let html = '';

        for (let i = 0; i < 6; i++) {
            if (i < cleanVal.length) {
                // 已输入的数字：蓝色加粗高亮显示
                html += `<div class="relative flex items-center justify-center w-6 md:w-8 text-4xl font-mono font-bold text-blue-400 transition-all transform scale-110">${cleanVal[i]}</div>`;
            } else if (i === cleanVal.length && isFocused) {
                // 正在等待输入的激活插槽：【横线消失】，仅显示闪烁的光标
                html += `<div class="relative flex items-center justify-center w-6 md:w-8 h-10">
                                <div class="w-[2px] h-full bg-blue-500 animate-cursor rounded-full shadow-[0_0_8px_rgba(59,130,246,0.8)]"></div>
                             </div>`;
            } else {
                // 尚未到达的空插槽：显示横线
                html += `<div class="relative flex items-center justify-center w-6 md:w-8 text-4xl font-mono font-bold text-gray-500">-</div>`;
            }
        }
        displayDiv.innerHTML = html;
    }

    function handleOTPInput(val) {
        const cleanVal = val.replace(/\D/g, '').substring(0, 6);
        document.getElementById('otpInput').value = cleanVal;

        // 实时渲染当前输入状态
        renderOTP(cleanVal, true);

        if (cleanVal.length === 6) {
            submitOTP();
        }
    }

    function startExtract() {
        const org = document.getElementById('org').value;
        const email = document.getElementById('email').value;
        if (!org || !email) return alert("请填写 Organization 和 Email！");

        logArea.innerHTML = `<div><span class="text-gray-500">[${new Date().toLocaleTimeString()}]</span> > 启动提取任务...</div>`;
        resetOTPUI();
        resetResultUI();

        sendWS({
            action: 'start_extract',
            org: org,
            email: email,
            proxy_name: document.getElementById('proxy_name').value
        });
    }

    function startScan() {
        logArea.innerHTML = `<div><span class="text-gray-500">[${new Date().toLocaleTimeString()}]</span> > 启动 IP 优选任务...</div>`;
        sendWS({action: 'start_scan'});
    }

    function submitOTP() {
        const otpInput = document.getElementById('otpInput');
        const otp = otpInput.value;
        if (otp.length !== 6) return;

        otpInput.disabled = true;
        resetOTPUI();

        sendWS({action: 'submit_otp', otp: otp});
    }

    function resetOTPUI() {
        document.getElementById('otpSection').classList.replace('border-blue-500', 'border-gray-700');
        document.getElementById('otpTitle').textContent = "🔑 安全验证 (等待触发)";
        document.getElementById('otpTitle').classList.replace('text-blue-400', 'text-gray-300');
        document.getElementById('otpDesc').textContent = "提取任务进行中时，如果需要验证，请在此输入邮箱收到的 6 位验证码。";
        document.getElementById('otpDesc').classList.replace('text-gray-300', 'text-gray-500');

        const otpInput = document.getElementById('otpInput');
        const otpDisplay = document.getElementById('otpDisplay');

        otpInput.disabled = true;
        otpInput.value = '';
        otpDisplay.classList.replace('border-blue-500', 'border-gray-700');

        // 恢复为灰色的无光标状态
        renderOTP('', false);
    }

    function resetResultUI() {
        const tabs = ['Surge', 'Stash', 'Loon', 'Shadowrocket'];
        tabs.forEach(tab => {
            document.getElementById(`text-${tab}`).value = '';
        });
    }

    function switchTab(activeId) {
        const tabs = ['Surge', 'Stash', 'Loon', 'Shadowrocket'];
        tabs.forEach(id => {
            const btn = document.getElementById(`btn-${id}`);
            const content = document.getElementById(`content-${id}`);

            if (id === activeId) {
                btn.classList.add('active');
                content.classList.add('active');
            } else {
                btn.classList.remove('active');
                content.classList.remove('active');
            }
        });
    }

    function copyText(textareaId, btnElement) {
        const textarea = document.getElementById(textareaId);
        if (!textarea.value) return;

        textarea.select();
        document.execCommand('copy');

        const originalHTML = btnElement.innerHTML;
        btnElement.innerHTML = `<svg class="w-4 h-4 mr-1 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span class="text-green-400">已复制!</span>`;
        btnElement.classList.replace('bg-gray-700', 'bg-gray-800');

        setTimeout(() => {
            btnElement.innerHTML = originalHTML;
            btnElement.classList.replace('bg-gray-800', 'bg-gray-700');
            window.getSelection().removeAllRanges();
        }, 2000);
    }

    window.onload = connectWebSocket;
</script>
</body>
</html>
